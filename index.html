<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle d'Entrée - ASTER</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; color: #333; margin-top: 0; }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
        }
        #result-container {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            color: white;
            display: none;
        }
        .bg-success { background-color: #28a745; } /* Vert : Entrée validée */
        .bg-already { background-color: #ffc107; color: #333 !important; } /* Orange : Déjà présent */
        .bg-unknown { background-color: #dc3545; } /* Rouge : Inconnu */
        
        .status-title { font-size: 18px; font-weight: bold; }
        .member-name { font-size: 16px; margin-top: 6px; }
        .scanned-code { font-size: 14px; margin-top: 6px; opacity: 0.9; }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo ASTER" class="logo">
    <h1>Contrôle des Entrées</h1>
    <div id="reader"></div>
    
    <div id="result-container">
        <div id="result-status" class="status-title">En attente...</div>
        <div id="result-name" class="member-name"></div>
        <div id="result-code" class="scanned-code"></div>
    </div>

    <button id="restart-btn" style="display:none;" onclick="relancerScan()">Scanner un autre</button>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwmaAD0qokoqfw7x4SqsjOQfgpxcdTdmUJrlG7xykf6Gs5svAf2Qty5TwzeC5Uj0zg/exec";
        let html5QrCode;

        function surScanReussi(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                verifierDansGoogleSheet(decodedText);
            }).catch(err => console.error(err));
        }

        function verifierDansGoogleSheet(code) {
            // Nettoyage intelligent : si la caméra lit une URL complète, on extrait l'ID
            try {
                if (code.includes('?')) {
                    const urlObj = new URL(code);
                    code = urlObj.searchParams.get('id') || urlObj.searchParams.get('code') || code;
                }
            } catch (e) {
                // Si ce n'est pas une URL valide, on garde le texte brut scanné
            }

            const container = document.getElementById('result-container');
            const statusEl = document.getElementById('result-status');
            const nameEl = document.getElementById('result-name');
            const codeEl = document.getElementById('result-code');
            const btn = document.getElementById('restart-btn');

            container.style.display = 'block';
            statusEl.innerText = "Vérification...";
            nameEl.innerText = "";
            codeEl.innerText = "Code : " + code;
            container.className = "";

            fetch(`${WEB_APP_URL}?code=${encodeURIComponent(code)}&action=entree`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "ok") {
                        container.className = "bg-success";
                        statusEl.innerText = "✔ ACCÈS AUTORISÉ";
                        nameEl.innerText = data.name;
                    } else if (data.status === "already_entered") {
                        container.className = "bg-already";
                        statusEl.innerText = "⚠ DÉJÀ POINTÉ";
                        nameEl.innerText = `${data.name} est déjà entré.`;
                    } else {
                        container.className = "bg-unknown";
                        statusEl.innerText = "✖ INCONNU";
                        nameEl.innerText = "Ce QR code n'existe pas.";
                    }
                    codeEl.innerText = "ID : " + code;
                    btn.style.display = 'inline-block';
                })
                .catch(err => {
                    container.className = "bg-unknown";
                    statusEl.innerText = "Erreur de communication";
                    nameEl.innerText = "Vérifiez votre connexion.";
                    codeEl.innerText = "ID : " + code;
                    btn.style.display = 'inline-block';
                    console.error(err);
                });
        }

        function relancerScan() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            demarrerCamera();
        }

        function demarrerCamera() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                surScanReussi
            ).catch(err => alert("Erreur caméra : " + err));
        }

        window.onload = demarrerCamera;
    </script>
</body>
</html>
