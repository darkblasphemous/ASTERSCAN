<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle de Sortie - ASTER</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; color: #333; margin-top: 0; }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
        }
        #result-container {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            color: white;
            display: none;
        }
        .bg-sortie { background-color: #17a2b8; }   /* Bleu : Sortie validée */
        .bg-already { background-color: #ffc107; color: #333 !important; } /* Orange : Sortie impossible */
        .bg-unknown { background-color: #dc3545; }  /* Rouge : Inconnu */
        .bg-enquete { background-color: #fd7e14; }  /* Orange vif : Enquête requise */
        
        .status-title { font-size: 18px; font-weight: bold; }
        .member-name { font-size: 16px; margin-top: 6px; }
        .scanned-code { font-size: 14px; margin-top: 6px; opacity: 0.9; }

        button, .btn-link {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-enquete {
            background-color: #28a745 !important; /* Vert pour inciter à remplir l'enquête */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo ASTER" class="logo">
    <h1>Contrôle des Sorties</h1>
    <div id="reader"></div>
    
    <div id="result-container">
        <div id="result-status" class="status-title">En attente...</div>
        <div id="result-name" class="member-name"></div>
        <div id="result-code" class="scanned-code"></div>
        <!-- Conteneur pour le bouton dynamique de l'enquête -->
        <div id="enquete-action-container"></div>
    </div>

    <button id="restart-btn" style="display:none;" onclick="relancerScan()">Scanner un autre</button>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwmaAD0qokoqfw7x4SqsjOQfgpxcdTdmUJrlG7xykf6Gs5svAf2Qty5TwzeC5Uj0zg/exec";
        let html5QrCode;

        function surScanReussi(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                verifierDansGoogleSheet(decodedText);
            }).catch(err => console.error(err));
        }

        function verifierDansGoogleSheet(code) {
            const container = document.getElementById('result-container');
            const statusEl = document.getElementById('result-status');
            const nameEl = document.getElementById('result-name');
            const codeEl = document.getElementById('result-code');
            const btn = document.getElementById('restart-btn');
            const enqueteContainer = document.getElementById('enquete-action-container');

            container.style.display = 'block';
            statusEl.innerText = "Vérification...";
            nameEl.innerText = "";
            codeEl.innerText = "Code : " + code;
            container.className = "";
            enqueteContainer.innerHTML = ""; // On nettoie l'ancien bouton éventuel

            fetch(`${WEB_APP_URL}?code=${encodeURIComponent(code)}&action=sortie`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "ok") {
                        container.className = "bg-sortie";
                        statusEl.innerText = "✔ SORTIE VALIDÉE";
                        nameEl.innerText = data.name;
                        btn.style.display = 'inline-block';
                    } else if (data.status === "enquete_requise") {
                        container.className = "bg-enquete";
                        statusEl.innerText = "📝 ENQUÊTE REQUISE";
                        nameEl.innerText = data.name + " : " + data.message;
                        
                        // Création du bouton interactif vers le Google Form pré-rempli
                        let formLink = document.createElement('a');
                        formLink.href = data.url;
                        formLink.target = "_blank";
                        formLink.innerText = "Remplir l'enquête de satisfaction";
                        formLink.className = "btn-link btn-enquete";
                        enqueteContainer.appendChild(formLink);
                        
                        // On laisse aussi la possibilité de scanner un autre badge si besoin
                        btn.style.display = 'inline-block';
                    } else if (data.status === "sortie_impossible") {
                        container.className = "bg-already";
                        statusEl.innerText = "⚠ SORTIE IMPOSSIBLE";
                        nameEl.innerText = `${data.name} n'est pas marqué comme présent.`;
                        btn.style.display = 'inline-block';
                    } else {
                        container.className = "bg-unknown";
                        statusEl.innerText = "✖ INCONNU";
                        nameEl.innerText = "Ce QR code n'existe pas.";
                        btn.style.display = 'inline-block';
                    }
                    codeEl.innerText = "ID : " + code;
                })
                .catch(err => {
                    container.className = "bg-unknown";
                    statusEl.innerText = "Erreur de communication";
                    nameEl.innerText = "Vérifiez votre connexion.";
                    codeEl.innerText = "ID : " + code;
                    btn.style.display = 'inline-block';
                    console.error(err);
                });
        }

        function relancerScan() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('enquete-action-container').innerHTML = '';
            document.getElementById('reader').style.display = 'block';
            demarrerCamera();
        }

        function demarrerCamera() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                surScanReussi
            ).catch(err => alert("Erreur caméra : " + err));
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('id');
            
            if (idFromUrl) {
                document.getElementById('reader').style.display = 'none';
                verifierDansGoogleSheet(idFromUrl);
            } else {
                demarrerCamera();
            }
        };
    </script>
</body>
</html>
